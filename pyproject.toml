[project]
# PyPI distribution name. "llm-memory" is taken by an unrelated project, so the
# published package is "llm-memory-mcp". The import package (llm_memory) and the
# CLI commands (llm-memory, llm-memory-mcp) are unchanged.
name = "llm-memory-mcp"
version = "0.2.3"
description = "Human-inspired memory system for LLMs - persistent context, compressed knowledge, and intent tracking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dineth Jayakody"}
]
keywords = ["llm", "memory", "ai", "context", "embeddings", "chromadb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.21.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
ollama = ["ollama>=0.1.0", "aiohttp>=3.14.1"]
chroma = ["chromadb>=0.4.0"]
local-embeddings = ["sentence-transformers>=2.2.0"]
api = [
    "fastapi>=0.139.0",
    "uvicorn>=0.23.0",
    "PyJWT[crypto]>=2.13.0",
    "cryptography>=49.0.0",
    "python-multipart>=0.0.32",
    "starlette>=1.3.1",
    "passlib[bcrypt]>=1.7.4",
]
mcp = ["mcp>=0.1.0"]
capture = [
    "defusedxml>=0.7.1",
    "gitpython>=3.1.0",
    "watchdog>=3.0.0",
]
analysis = [
    "scikit-learn>=1.0.0",
]
arcadedb = ["arcadedb-embedded>=26.4.2,<27"]
neo4j = ["neo4j>=5.15.0"]
dev = [
    "build>=1.3.0",
    "httpx>=0.28.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0.0",
    "pip-audit>=2.9.0",
    "ruff>=0.1.0",
    "twine>=6.2.0",
]
all = ["llm-memory-mcp[openai,ollama,local-embeddings,api,mcp,capture,analysis,arcadedb,neo4j]"]

[project.urls]
Homepage = "https://github.com/djkeshawa/llm-memory"
Repository = "https://github.com/djkeshawa/llm-memory"
Issues = "https://github.com/djkeshawa/llm-memory/issues"
Changelog = "https://github.com/djkeshawa/llm-memory/releases"

[project.scripts]
llm-memory = "llm_memory.interfaces.cli:app"
llm-memory-mcp = "llm_memory.interfaces.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_memory"]
artifacts = [
    "src/llm_memory/server/static/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "llm-memory-dashboard/",
    "build_frontend.py",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
extend-select = ["B007", "B033", "S324"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
