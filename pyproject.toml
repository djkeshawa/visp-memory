[project]
# PyPI distribution name.
# The import package is visp_memory; the console scripts are `visp-memory` (CLI) and
# `visp-memory-mcp` (MCP server).
name = "visp-memory"
version = "0.3.0"
description = "Curated, auditable memory for coding agents - mines your git history, injects sparingly, quarantines untrusted memory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Dineth Jayakody"}
]
keywords = [
    "ai", "llm", "memory", "coding-agent", "mcp", "claude-code",
    "context", "rag", "retrieval", "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.21.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.40.0"]
ollama = ["ollama>=0.1.0", "aiohttp>=3.14.1"]
chroma = ["chromadb>=0.4.0"]
local-embeddings = ["sentence-transformers>=2.2.0"]
api = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.23.0",
    "PyJWT[crypto]>=2.13.0",
    "cryptography>=49.0.0",
    "python-multipart>=0.0.32",
    "starlette>=1.3.1",
]
# Floor raised from the meaningless >=0.1.0: the server uses the modern
# mcp.server/mcp.types API, and an unbounded floor let resolvers pick anything.
mcp = ["mcp>=1.0.0"]
capture = [
    "defusedxml>=0.7.1",
    "gitpython>=3.1.0",
    "watchdog>=3.0.0",
]
analysis = [
    "scikit-learn>=1.0.0",
]
arcadedb = ["arcadedb-embedded>=26.4.2,<27"]
neo4j = ["neo4j>=5.15.0"]
dev = [
    "build>=1.3.0",
    "httpx>=0.28.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0.0",
    "pip-audit>=2.9.0",
    "ruff>=0.1.0",
    "twine>=6.2.0",
]
all = ["visp-memory[openai,anthropic,ollama,local-embeddings,api,mcp,capture,analysis,arcadedb,neo4j]"]

[project.urls]
Homepage = "https://github.com/djkeshawa/visp-memory"
Repository = "https://github.com/djkeshawa/visp-memory"
Issues = "https://github.com/djkeshawa/visp-memory/issues"
Changelog = "https://github.com/djkeshawa/visp-memory/releases"

[project.scripts]
visp-memory = "visp_memory.interfaces.cli:app"
visp-memory-mcp = "visp_memory.interfaces.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visp_memory"]
artifacts = [
    "src/visp_memory/server/static/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "visp-memory-dashboard/",
    "build_frontend.py",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    # Apache-2.0 section 4(d) requires the NOTICE file to accompany distributions.
    "NOTICE",
    "CONTRIBUTING.md",
    "CLA.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
extend-select = ["B007", "B033", "S324"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
