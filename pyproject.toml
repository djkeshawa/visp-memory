[project]
name = "llm-memory"
version = "0.2.0"
description = "Human-inspired memory system for LLMs - persistent context, compressed knowledge, and intent tracking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dineth Jayakody"}
]
keywords = ["llm", "memory", "ai", "context", "embeddings", "chromadb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "chromadb>=0.4.0",
    "typer[all]>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
ollama = ["ollama>=0.1.0"]
local-embeddings = ["sentence-transformers>=2.2.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "python-jose[cryptography]>=3.3.0", "passlib[bcrypt]>=1.7.4"]
mcp = ["mcp>=0.1.0"]
capture = [
    "gitpython>=3.1.0",
    "watchdog>=3.0.0",
]
analysis = [
    "scikit-learn>=1.0.0",
]
arcadedb = ["arcadedb-embedded>=26.4.2,<27"]
neo4j = ["neo4j>=5.15.0"]
dev = [
    "httpx>=0.28.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
all = ["llm-memory[openai,ollama,local-embeddings,api,mcp,capture,analysis,arcadedb,neo4j,dev]"]

[project.scripts]
llm-memory = "llm_memory.interfaces.cli:app"
llm-memory-mcp = "llm_memory.interfaces.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_memory"]
artifacts = [
    "src/llm_memory/server/static/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "llm-memory-dashboard/",
    "build_frontend.py",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
