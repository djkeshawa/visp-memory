name: visp-memory

x-visp-memory-build: &visp-memory-build
  context: .
  args:
    VISP_MEMORY_EXTRAS: ${VISP_MEMORY_EXTRAS:-api,mcp,arcadedb,neo4j,openai,anthropic,ollama}

x-visp-memory-env: &visp-memory-env
  VISP_MEMORY_SERVER_AUTH_ENABLED: ${VISP_MEMORY_SERVER_AUTH_ENABLED:-true}
  VISP_MEMORY_SERVER_ALLOW_ANONYMOUS: ${VISP_MEMORY_SERVER_ALLOW_ANONYMOUS:-false}
  VISP_MEMORY_BOOTSTRAP_ADMIN_USERNAME: ${VISP_MEMORY_BOOTSTRAP_ADMIN_USERNAME:-admin}
  VISP_MEMORY_BOOTSTRAP_ADMIN_PASSWORD: ${VISP_MEMORY_BOOTSTRAP_ADMIN_PASSWORD:-}
  VISP_MEMORY_SERVER_SESSION_COOKIE_SECURE: ${VISP_MEMORY_SERVER_SESSION_COOKIE_SECURE:-false}
  VISP_MEMORY_SERVER_API_KEYS: ${VISP_MEMORY_SERVER_API_KEYS:-}
  VISP_MEMORY_STORAGE_ALLOW_FALLBACK: ${VISP_MEMORY_STORAGE_ALLOW_FALLBACK:-false}
  VISP_MEMORY_STORAGE_CONNECT_TIMEOUT_SECONDS: ${VISP_MEMORY_STORAGE_CONNECT_TIMEOUT_SECONDS:-30}
  VISP_MEMORY_REPO_ID: ${VISP_MEMORY_REPO_ID:-visp-memory}
  VISP_MEMORY_EMBEDDING_PROVIDER: ${VISP_MEMORY_EMBEDDING_PROVIDER:-auto}
  VISP_MEMORY_EMBEDDING_MODEL: ${VISP_MEMORY_EMBEDDING_MODEL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  VISP_MEMORY_LLM_PROVIDER: ${VISP_MEMORY_LLM_PROVIDER:-none}
  VISP_MEMORY_LLM_MODEL: ${VISP_MEMORY_LLM_MODEL:-}
  VISP_MEMORY_LLM_API_KEY: ${VISP_MEMORY_LLM_API_KEY:-}
  OLLAMA_HOST: ${OLLAMA_HOST:-}

services:
  visp-memory-lite:
    profiles: ["lite"]
    build: *visp-memory-build
    image: ${VISP_MEMORY_IMAGE:-visp-memory:local}
    ports:
      - "${VISP_MEMORY_BIND_HOST:-127.0.0.1}:${VISP_MEMORY_PORT:-8000}:8000"
    volumes:
      - visp-memory-lite-data:/data
    environment:
      <<: *visp-memory-env
      VISP_MEMORY_STORAGE_BACKEND: sqlite
      VISP_MEMORY_STORAGE_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/readyz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  visp-memory-arcadedb:
    profiles: ["arcadedb"]
    build: *visp-memory-build
    image: ${VISP_MEMORY_IMAGE:-visp-memory:local}
    ports:
      - "${VISP_MEMORY_BIND_HOST:-127.0.0.1}:${VISP_MEMORY_PORT:-8000}:8000"
    volumes:
      - visp-memory-arcadedb-data:/data
    environment:
      <<: *visp-memory-env
      VISP_MEMORY_STORAGE_BACKEND: arcadedb
      VISP_MEMORY_STORAGE_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/readyz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # There is deliberately no Neo4j-backed serving profile here. The Neo4j backend
  # fails closed on raw/episodic/semantic writes until it carries the schema-v3
  # Evidence graph (Neo4jStorage.store_memory), so a Neo4j "deployment" cannot
  # store memories -- the profiles that offered one ("full", "dashboard") were
  # removed after a live migration tripped over them. The backend's contract is
  # still exercised in CI via docker-compose.ci-neo4j.yml; whichever change lifts
  # the guard should reintroduce an operator profile in the same PR.

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.31.1
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:0.31.1
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${VISP_MEMORY_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  visp-memory-lite-data:
  visp-memory-arcadedb-data:
  ollama-data:
