name: visp-memory

x-visp-memory-build: &visp-memory-build
  context: .
  args:
    VISP_MEMORY_EXTRAS: ${VISP_MEMORY_EXTRAS:-api,mcp,arcadedb,neo4j,openai,anthropic,ollama}

x-visp-memory-env: &visp-memory-env
  VISP_MEMORY_SERVER_AUTH_ENABLED: ${VISP_MEMORY_SERVER_AUTH_ENABLED:-true}
  VISP_MEMORY_SERVER_ALLOW_ANONYMOUS: ${VISP_MEMORY_SERVER_ALLOW_ANONYMOUS:-false}
  VISP_MEMORY_BOOTSTRAP_ADMIN_USERNAME: ${VISP_MEMORY_BOOTSTRAP_ADMIN_USERNAME:-admin}
  VISP_MEMORY_BOOTSTRAP_ADMIN_PASSWORD: ${VISP_MEMORY_BOOTSTRAP_ADMIN_PASSWORD:-}
  VISP_MEMORY_SERVER_SESSION_COOKIE_SECURE: ${VISP_MEMORY_SERVER_SESSION_COOKIE_SECURE:-false}
  VISP_MEMORY_SERVER_API_KEYS: ${VISP_MEMORY_SERVER_API_KEYS:-}
  VISP_MEMORY_STORAGE_ALLOW_FALLBACK: ${VISP_MEMORY_STORAGE_ALLOW_FALLBACK:-false}
  VISP_MEMORY_STORAGE_CONNECT_TIMEOUT_SECONDS: ${VISP_MEMORY_STORAGE_CONNECT_TIMEOUT_SECONDS:-30}
  VISP_MEMORY_REPO_ID: ${VISP_MEMORY_REPO_ID:-visp-memory}
  VISP_MEMORY_EMBEDDING_PROVIDER: ${VISP_MEMORY_EMBEDDING_PROVIDER:-auto}
  VISP_MEMORY_EMBEDDING_MODEL: ${VISP_MEMORY_EMBEDDING_MODEL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  VISP_MEMORY_LLM_PROVIDER: ${VISP_MEMORY_LLM_PROVIDER:-none}
  VISP_MEMORY_LLM_MODEL: ${VISP_MEMORY_LLM_MODEL:-}
  VISP_MEMORY_LLM_API_KEY: ${VISP_MEMORY_LLM_API_KEY:-}
  OLLAMA_HOST: ${OLLAMA_HOST:-}

services:
  visp-memory-lite:
    profiles: ["lite"]
    build: *visp-memory-build
    image: ${VISP_MEMORY_IMAGE:-visp-memory:local}
    ports:
      - "${VISP_MEMORY_BIND_HOST:-127.0.0.1}:${VISP_MEMORY_PORT:-8000}:8000"
    volumes:
      - visp-memory-lite-data:/data
    environment:
      <<: *visp-memory-env
      VISP_MEMORY_STORAGE_BACKEND: sqlite
      VISP_MEMORY_STORAGE_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/readyz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  visp-memory-arcadedb:
    profiles: ["arcadedb"]
    build: *visp-memory-build
    image: ${VISP_MEMORY_IMAGE:-visp-memory:local}
    ports:
      - "${VISP_MEMORY_BIND_HOST:-127.0.0.1}:${VISP_MEMORY_PORT:-8000}:8000"
    volumes:
      - visp-memory-arcadedb-data:/data
    environment:
      <<: *visp-memory-env
      VISP_MEMORY_STORAGE_BACKEND: arcadedb
      VISP_MEMORY_STORAGE_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/readyz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  visp-memory-full:
    profiles: ["full"]
    build: *visp-memory-build
    image: ${VISP_MEMORY_IMAGE:-visp-memory:local}
    ports:
      - "${VISP_MEMORY_BIND_HOST:-127.0.0.1}:${VISP_MEMORY_PORT:-8000}:8000"
    volumes:
      - visp-memory-full-data:/data
    environment:
      <<: *visp-memory-env
      VISP_MEMORY_STORAGE_BACKEND: neo4j
      VISP_MEMORY_STORAGE_DATA_DIR: /data
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    depends_on:
      neo4j:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/readyz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Dashboard / API server on the Neo4j backend with a cloud embedding provider
  # (OpenRouter/OpenAI). Unlike `visp-memory-full` it does NOT require Ollama --
  # embeddings come from EMBEDDING_API_KEY (see .env.example). Brought up together
  # with neo4j via:  docker compose --profile dashboard up -d
  visp-memory-dashboard:
    profiles: ["dashboard"]
    build: *visp-memory-build
    image: ${VISP_MEMORY_IMAGE:-visp-memory:local}
    container_name: visp-memory-dashboard
    # Keep a startup gate for post-reboot restarts in addition to the application's
    # bounded connection retry and fail-fast behavior.
    command:
      - sh
      - -ec
      - |
        echo "Waiting for Neo4j to accept connections..."
        until python -c "import os; from neo4j import GraphDatabase; GraphDatabase.driver(os.environ.get('NEO4J_URI','bolt://neo4j:7687'), auth=(os.environ.get('NEO4J_USER','neo4j'), os.environ['NEO4J_PASSWORD'])).verify_connectivity()" 2>/dev/null; do
          sleep 2
        done
        echo "Neo4j is ready -- starting server."
        exec uvicorn visp_memory.server.app:app --host 0.0.0.0 --port 8000
    ports:
      - "${VISP_MEMORY_BIND_HOST:-127.0.0.1}:${VISP_MEMORY_PORT:-8000}:8000"
    volumes:
      - visp-memory-dashboard-data:/data
    environment:
      <<: *visp-memory-env
      # Landing project for the dashboard (memories are namespaced by repo_id). Set
      # this in .env to your active project, e.g. VISP_MEMORY_REPO_ID=novel; other
      # projects stay selectable from the dashboard's repo dropdown.
      VISP_MEMORY_REPO_ID: ${VISP_MEMORY_REPO_ID:-default}
      VISP_MEMORY_STORAGE_BACKEND: neo4j
      VISP_MEMORY_STORAGE_DATA_DIR: /data
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/readyz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  neo4j:
    profiles: ["full", "dashboard"]
    image: neo4j:5.26.28-community
    ports:
      - "${VISP_MEMORY_BIND_HOST:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${VISP_MEMORY_BIND_HOST:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    # Neo4j writes its lock to /var/lib/neo4j/run/neo4j.pid. After an unclean
    # shutdown (Docker/host restart, sleep, power loss) a stale pid is left in the
    # container layer, and `restart: unless-stopped` reuses that layer -- so Neo4j
    # loops on "Neo4j is already running (pid:N)". A tmpfs is wiped on every start,
    # so the stale pid can never block startup again.
    tmpfs:
      - /var/lib/neo4j/run:uid=7474,gid=7474,mode=700
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env} 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
    stop_grace_period: 60s
    restart: unless-stopped

  ollama:
    profiles: ["full", "ollama"]
    image: ollama/ollama:0.31.1
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  ollama-pull:
    profiles: ["full", "ollama"]
    image: ollama/ollama:0.31.1
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${VISP_MEMORY_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  visp-memory-lite-data:
  visp-memory-arcadedb-data:
  visp-memory-full-data:
  visp-memory-dashboard-data:
  neo4j-data:
  neo4j-logs:
  ollama-data:
