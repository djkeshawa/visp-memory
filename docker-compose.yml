name: llm-memory

x-llm-memory-build: &llm-memory-build
  context: .
  args:
    LLM_MEMORY_EXTRAS: ${LLM_MEMORY_EXTRAS:-api,mcp,arcadedb,neo4j,openai,ollama}

x-llm-memory-env: &llm-memory-env
  LLM_MEMORY_SERVER_AUTH_ENABLED: ${LLM_MEMORY_SERVER_AUTH_ENABLED:-false}
  LLM_MEMORY_SERVER_ALLOW_ANONYMOUS: ${LLM_MEMORY_SERVER_ALLOW_ANONYMOUS:-true}
  LLM_MEMORY_REPO_ID: ${LLM_MEMORY_REPO_ID:-llm-memory}
  LLM_MEMORY_EMBEDDING_PROVIDER: ${LLM_MEMORY_EMBEDDING_PROVIDER:-auto}
  LLM_MEMORY_EMBEDDING_MODEL: ${LLM_MEMORY_EMBEDDING_MODEL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OLLAMA_HOST: ${OLLAMA_HOST:-}

services:
  llm-memory-lite:
    profiles: ["lite"]
    build: *llm-memory-build
    image: ${LLM_MEMORY_IMAGE:-llm-memory:local}
    ports:
      - "${LLM_MEMORY_PORT:-8000}:8000"
    volumes:
      - llm-memory-lite-data:/data
    environment:
      <<: *llm-memory-env
      LLM_MEMORY_STORAGE_BACKEND: sqlite
      LLM_MEMORY_STORAGE_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/readyz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  llm-memory-arcadedb:
    profiles: ["arcadedb"]
    build: *llm-memory-build
    image: ${LLM_MEMORY_IMAGE:-llm-memory:local}
    ports:
      - "${LLM_MEMORY_PORT:-8000}:8000"
    volumes:
      - llm-memory-arcadedb-data:/data
    environment:
      <<: *llm-memory-env
      LLM_MEMORY_STORAGE_BACKEND: arcadedb
      LLM_MEMORY_STORAGE_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/readyz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  llm-memory-full:
    profiles: ["full"]
    build: *llm-memory-build
    image: ${LLM_MEMORY_IMAGE:-llm-memory:local}
    ports:
      - "${LLM_MEMORY_PORT:-8000}:8000"
    volumes:
      - llm-memory-full-data:/data
    environment:
      <<: *llm-memory-env
      LLM_MEMORY_STORAGE_BACKEND: neo4j
      LLM_MEMORY_STORAGE_DATA_DIR: /data
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-memorypass}
    depends_on:
      neo4j:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/readyz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  neo4j:
    profiles: ["full"]
    image: neo4j:5.15
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-memorypass}
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-memorypass} 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
    stop_grace_period: 60s
    restart: unless-stopped

  ollama:
    profiles: ["full", "ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  ollama-pull:
    profiles: ["full", "ollama"]
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LLM_MEMORY_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  llm-memory-lite-data:
  llm-memory-arcadedb-data:
  llm-memory-full-data:
  neo4j-data:
  neo4j-logs:
  ollama-data:
