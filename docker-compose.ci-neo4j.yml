# CI harness for the Neo4j backend's contract smoke -- NOT a deployment.
#
# The Neo4j backend fails closed on raw/episodic/semantic writes until it
# carries the schema-v3 Evidence graph, so the operator compose file offers no
# Neo4j profile. This file exists solely for the "Docker + Neo4j runtime smoke"
# CI job, which pins that contract: intent writes land, the governed layers
# return 501. Whichever change lifts the guard in Neo4jStorage.store_memory
# should reintroduce an operator profile and update the CI job in the same PR.
#
#   docker compose -f docker-compose.ci-neo4j.yml up -d --build --wait

services:
  visp-memory-neo4j-smoke:
    build:
      context: .
      args:
        VISP_MEMORY_EXTRAS: ${VISP_MEMORY_EXTRAS:-api,mcp,arcadedb,neo4j,openai,anthropic,ollama}
    image: ${VISP_MEMORY_IMAGE:-visp-memory:local}
    # Startup gate: the application's connection retry is bounded and fail-fast,
    # so wait for Bolt before starting the server.
    command:
      - sh
      - -ec
      - |
        echo "Waiting for Neo4j to accept connections..."
        until python -c "import os; from neo4j import GraphDatabase; GraphDatabase.driver(os.environ.get('NEO4J_URI','bolt://neo4j:7687'), auth=(os.environ.get('NEO4J_USER','neo4j'), os.environ['NEO4J_PASSWORD'])).verify_connectivity()" 2>/dev/null; do
          sleep 2
        done
        echo "Neo4j is ready -- starting server."
        exec uvicorn visp_memory.server.app:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${VISP_MEMORY_PORT:-8000}:8000"
    environment:
      VISP_MEMORY_SERVER_AUTH_ENABLED: ${VISP_MEMORY_SERVER_AUTH_ENABLED:-false}
      VISP_MEMORY_SERVER_ALLOW_ANONYMOUS: ${VISP_MEMORY_SERVER_ALLOW_ANONYMOUS:-true}
      VISP_MEMORY_EMBEDDING_PROVIDER: ${VISP_MEMORY_EMBEDDING_PROVIDER:-noop}
      VISP_MEMORY_STORAGE_BACKEND: neo4j
      VISP_MEMORY_STORAGE_ALLOW_FALLBACK: "false"
      VISP_MEMORY_STORAGE_DATA_DIR: /data
      VISP_MEMORY_REPO_ID: ${VISP_MEMORY_REPO_ID:-default}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/readyz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.26.28-community
    # A stale pid file in the container layer blocks restart after an unclean
    # shutdown; a tmpfs is wiped on every start. Harmless in CI, kept so this
    # file stays a faithful template for a future operator profile.
    tmpfs:
      - /var/lib/neo4j/run:uid=7474,gid=7474,mode=700
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
    stop_grace_period: 60s
