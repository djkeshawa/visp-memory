name: CI

# Runs the quality gates (lint, tests, dashboard build) on every push and pull
# request so regressions are caught before a release tag, not after.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
            coverage: false
          - os: ubuntu-latest
            python-version: '3.12'
            coverage: true
          - os: windows-latest
            python-version: '3.12'
            coverage: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install supported test profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,mcp,capture,analysis,arcadedb,neo4j,dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        if: ${{ !matrix.coverage }}
        run: pytest -q

      - name: Pytest with coverage
        if: ${{ matrix.coverage }}
        run: >-
          pytest -q --cov=visp_memory --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85

      - name: Upload coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  evals:
    # Deterministic memory-quality evaluations (no network, noop embeddings):
    # recall precision, hallucination-risk reduction, agent A/B behavior, and
    # storage benchmarks. Guards the project's core claims (retrieval quality
    # and token efficiency) against silent regression, beyond unit tests.
    name: Memory evaluations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,mcp,capture,analysis,dev]"

      - name: Oracle-gap evaluation (injection selection quality)
        run: python scripts/evaluate_oracle_gap.py --json

      - name: Memory poisoning evaluation (provenance quarantine)
        run: python scripts/evaluate_poisoning.py --json

      - name: Agent A/B evaluation
        run: python scripts/evaluate_agent_ab.py --json

      - name: Hallucination-risk evaluation
        run: python scripts/evaluate_hallucination.py --json

      - name: Memory intelligence evaluation
        run: python scripts/evaluate_memory_intelligence.py --json

      - name: Task brief evaluation
        run: python scripts/evaluate_task_brief.py

      - name: Hybrid retrieval evaluation
        run: python scripts/evaluate_hybrid_retrieval.py

      - name: Structural recall evaluation (synthetic corpus)
        run: python scripts/evaluate_structural_recall.py

      - name: Storage benchmark (smoke)
        run: python scripts/benchmark_memory.py --items 50 --json

  dashboard:
    name: Dashboard (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'visp-memory-dashboard/package-lock.json'

      - name: Install dashboard dependencies
        working-directory: visp-memory-dashboard
        run: npm ci

      - name: Lint
        working-directory: visp-memory-dashboard
        run: npm run lint

      - name: Build (type-check + bundle)
        working-directory: visp-memory-dashboard
        run: npm run build

  lockfile:
    name: Lockfile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv lock --check

  security:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'visp-memory-dashboard/package-lock.json'
      - name: Audit supported Python profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,mcp,capture,analysis,neo4j,dev]"
          python -m pip_audit --skip-editable
      - name: Audit dashboard dependencies
        working-directory: visp-memory-dashboard
        run: |
          npm ci
          npm audit

  browser-smoke:
    name: Packaged browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'visp-memory-dashboard/package-lock.json'
      - run: python -m pip install -e ".[api,mcp]"
      - working-directory: visp-memory-dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: python build_frontend.py
      - run: python scripts/smoke_packaged_dashboard.py --browser

  docker-neo4j-smoke:
    name: Docker + Neo4j runtime smoke
    runs-on: ubuntu-latest
    env:
      NEO4J_PASSWORD: ci-only-neo4j-password
      VISP_MEMORY_SERVER_AUTH_ENABLED: 'false'
      VISP_MEMORY_SERVER_ALLOW_ANONYMOUS: 'true'
      VISP_MEMORY_EMBEDDING_PROVIDER: noop
    steps:
      - uses: actions/checkout@v4
      - name: Build and start dashboard profile
        run: docker compose -f docker-compose.ci-neo4j.yml up -d --build --wait
      - name: Verify readiness and core routes
        run: |
          curl --fail http://127.0.0.1:8000/readyz
          curl --fail http://127.0.0.1:8000/repos/scopes
          curl --fail -X POST -H 'Content-Type: application/json' \
            -d '{"id":"ci-repo","name":"CI Repository"}' http://127.0.0.1:8000/repos
          curl --fail -X POST http://127.0.0.1:8000/sessions
          curl --fail 'http://127.0.0.1:8000/?repo_id=ci-repo'

      # This backend supports one memory layer and refuses the other three. Both
      # halves are asserted, because a smoke test that only exercises what happens
      # to work cannot tell a correct refusal from an outage.
      #
      # The write this step used to make named no layer, so it took MemoryCreate's
      # `episodic` default and hit the schema-v3 guard in Neo4jStorage.store_memory
      # every single run -- 501, `curl --fail`, red job. That refusal is the
      # documented, intended behaviour; the assertion was what was wrong.
      - name: Verify the Neo4j memory-write contract
        run: |
          set -euo pipefail

          # --fail-with-body, not --fail: on a refusal the body carries which
          # contract broke, and a bare `exit 22` is the ambiguity this step exists
          # to remove.
          #
          # `intent` is the only layer this backend accepts, so this is the write
          # that proves routing, scope check and storage actually work.
          curl --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/json' \
            -d '{"content":"CI memory","repo_id":"ci-repo","layer":"intent"}' \
            http://127.0.0.1:8000/memories

          # Read it back. A POST returning 2xx while the node never lands is a
          # failure the write alone cannot see. Captured rather than piped into
          # grep: `grep -q` exits at the first match and SIGPIPEs curl, which
          # under `pipefail` would fail the check precisely when it succeeded.
          body=$(curl --fail-with-body --silent --show-error \
            'http://127.0.0.1:8000/memories?repo_id=ci-repo&layer=intent') \
            || { echo "::error::reading back the intent write failed"; exit 1; }
          case "$body" in
            *"CI memory"*) ;;
            *) echo "::error::the intent write did not read back"; exit 1 ;;
          esac

          # The governed layers fail closed until Neo4j carries the schema-v3
          # Evidence graph; 501 is the contract, and anything else is the
          # regression worth catching. Whichever change lifts the guard in
          # Neo4jStorage.store_memory must update this loop in the same PR --
          # otherwise the feature landing reads here as a broken smoke test.
          #
          # `semantic` is deliberately absent: the router rejects a semantic write
          # with no evidence id at 422 before storage is reached, so it would prove
          # the schema check rather than the backend guard.
          for layer in raw episodic; do
            # `|| true`: without --fail curl still exits non-zero on a transport
            # error, and under `set -e` that would kill the step before the
            # ::error:: below could say what happened. `000` means "never answered".
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              -d "{\"content\":\"CI memory\",\"repo_id\":\"ci-repo\",\"layer\":\"$layer\"}" \
              http://127.0.0.1:8000/memories || true)
            if [ "$code" != "501" ]; then
              echo "::error::$layer write returned ${code:-000}; the fail-closed guard expects 501"
              exit 1
            fi
          done

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci-neo4j.yml logs --no-color
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.ci-neo4j.yml down
