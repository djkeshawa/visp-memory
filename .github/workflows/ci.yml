name: CI

# Runs the quality gates (lint, tests, dashboard build) on every push and pull
# request so regressions are caught before a release tag, not after.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
            coverage: false
          - os: ubuntu-latest
            python-version: '3.12'
            coverage: true
          - os: windows-latest
            python-version: '3.12'
            coverage: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install supported test profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,mcp,capture,analysis,arcadedb,neo4j,dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        if: ${{ !matrix.coverage }}
        run: pytest -q

      - name: Pytest with coverage
        if: ${{ matrix.coverage }}
        run: >-
          pytest -q --cov=visp_memory --cov-report=term-missing --cov-report=xml
          --cov-fail-under=74

      - name: Upload coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  evals:
    # Deterministic memory-quality evaluations (no network, noop embeddings):
    # recall precision, hallucination-risk reduction, agent A/B behavior, and
    # storage benchmarks. Guards the project's core claims (retrieval quality
    # and token efficiency) against silent regression, beyond unit tests.
    name: Memory evaluations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,mcp,capture,analysis,dev]"

      - name: Oracle-gap evaluation (injection selection quality)
        run: python scripts/evaluate_oracle_gap.py --json

      - name: Memory poisoning evaluation (provenance quarantine)
        run: python scripts/evaluate_poisoning.py --json

      - name: Agent A/B evaluation
        run: python scripts/evaluate_agent_ab.py --json

      - name: Hallucination-risk evaluation
        run: python scripts/evaluate_hallucination.py --json

      - name: Memory intelligence evaluation
        run: python scripts/evaluate_memory_intelligence.py --json

      - name: Task brief evaluation
        run: python scripts/evaluate_task_brief.py

      - name: Hybrid retrieval evaluation
        run: python scripts/evaluate_hybrid_retrieval.py

      - name: Storage benchmark (smoke)
        run: python scripts/benchmark_memory.py --items 50 --json

  dashboard:
    name: Dashboard (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'visp-memory-dashboard/package-lock.json'

      - name: Install dashboard dependencies
        working-directory: visp-memory-dashboard
        run: npm ci

      - name: Lint
        working-directory: visp-memory-dashboard
        run: npm run lint

      - name: Build (type-check + bundle)
        working-directory: visp-memory-dashboard
        run: npm run build

  lockfile:
    name: Lockfile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv lock --check

  security:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'visp-memory-dashboard/package-lock.json'
      - name: Audit supported Python profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,mcp,capture,analysis,neo4j,dev]"
          python -m pip_audit --skip-editable
      - name: Audit dashboard dependencies
        working-directory: visp-memory-dashboard
        run: |
          npm ci
          npm audit

  browser-smoke:
    name: Packaged browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'visp-memory-dashboard/package-lock.json'
      - run: python -m pip install -e ".[api,mcp]"
      - working-directory: visp-memory-dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: python build_frontend.py
      - run: python scripts/smoke_packaged_dashboard.py --browser

  docker-neo4j-smoke:
    name: Docker + Neo4j runtime smoke
    runs-on: ubuntu-latest
    env:
      NEO4J_PASSWORD: ci-only-neo4j-password
      VISP_MEMORY_SERVER_AUTH_ENABLED: 'false'
      VISP_MEMORY_SERVER_ALLOW_ANONYMOUS: 'true'
      VISP_MEMORY_EMBEDDING_PROVIDER: noop
    steps:
      - uses: actions/checkout@v7
      - name: Build and start dashboard profile
        run: docker compose --profile dashboard up -d --build --wait
      - name: Verify readiness and core routes
        run: |
          curl --fail http://127.0.0.1:8000/readyz
          curl --fail http://127.0.0.1:8000/repos/scopes
          curl --fail -X POST -H 'Content-Type: application/json' \
            -d '{"id":"ci-repo","name":"CI Repository"}' http://127.0.0.1:8000/repos
          curl --fail -X POST -H 'Content-Type: application/json' \
            -d '{"content":"CI memory","repo_id":"ci-repo"}' http://127.0.0.1:8000/memories
          curl --fail -X POST http://127.0.0.1:8000/sessions
          curl --fail 'http://127.0.0.1:8000/?repo_id=ci-repo'
      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile dashboard logs --no-color
      - name: Stop services
        if: always()
        run: docker compose --profile dashboard down
