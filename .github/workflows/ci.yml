name: CI

# Runs the quality gates (lint, tests, dashboard build) on every push and pull
# request so regressions are caught before a release tag, not after.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest -q

  evals:
    # Deterministic memory-quality evaluations (no network, noop embeddings):
    # recall precision, hallucination-risk reduction, agent A/B behavior, and
    # storage benchmarks. Guards the project's core claims (retrieval quality
    # and token efficiency) against silent regression, beyond unit tests.
    name: Memory evaluations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,mcp,capture,analysis,dev]"

      - name: Agent A/B evaluation
        run: python scripts/evaluate_agent_ab.py --json

      - name: Hallucination-risk evaluation
        run: python scripts/evaluate_hallucination.py --json

      - name: Memory intelligence evaluation
        run: python scripts/evaluate_memory_intelligence.py --json

      - name: Storage benchmark (smoke)
        run: python scripts/benchmark_memory.py --items 50 --json

  dashboard:
    name: Dashboard (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'llm-memory-dashboard/package-lock.json'

      - name: Install dashboard dependencies
        working-directory: llm-memory-dashboard
        run: npm ci

      - name: Lint
        working-directory: llm-memory-dashboard
        run: npm run lint

      - name: Build (type-check + bundle)
        working-directory: llm-memory-dashboard
        run: npm run build
