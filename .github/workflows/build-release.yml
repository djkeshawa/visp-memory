name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'llm-memory-dashboard/package-lock.json'

      - name: Install Python quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" build twine

      - name: Dashboard quality checks
        working-directory: llm-memory-dashboard
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --omit=dev

      - name: Python package, MCP, and CLI smoke checks
        run: python3 scripts/release_check.py --skip-frontend

  build-python:
    name: Build Python Package
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Copy Frontend
        run: python3 build_frontend.py

      - name: Build Python Package
        run: |
          pip install build
          python -m build

      - name: Validate distribution metadata
        # Fails the release early if the long description would not render on
        # PyPI or the metadata is malformed — before any publish is attempted.
        run: |
          pip install twine
          twine check dist/*

      - name: Upload Python Package
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  build-docker:
    name: Build Docker Image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-standalone:
    name: Build Standalone Executable
    needs: quality
    strategy:
      # One OS failing must not cancel the other builds (a cancelled matrix
      # skips the Create Release job and loses ALL artifacts for the tag).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Install UPX (macOS)
        if: runner.os == 'macOS'
        run: brew install upx

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx

      - name: Build and Copy Frontend
        run: python3 build_frontend.py

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build_standalone.sh

      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          python build_frontend.py
          pyinstaller llm-memory.spec

      - name: Upload Standalone Build
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}
          path: dist/llm-memory-standalone-*

  publish-pypi:
    name: Publish to PyPI
    needs: [quality, build-python]
    # Only real version tags publish to PyPI (PyPI rejects re-uploads of an
    # existing version, so this must never run on branch pushes or dispatch).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-memory-mcp
    permissions:
      # OIDC token for PyPI Trusted Publishing — no API token stored in GitHub.
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release:
    name: Create Release
    needs: [quality, build-python, build-docker, build-standalone]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # Required for softprops/action-gh-release to create the GitHub Release
      # and upload assets. Without this the default GITHUB_TOKEN is read-only
      # (repo policy) and the release step 403s.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            python-package/*
            standalone-Linux/*
            standalone-macOS/*
            standalone-Windows/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
