name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'visp-memory-dashboard/package-lock.json'

      - name: Install Python quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,mcp,capture,analysis,arcadedb,neo4j,dev]"

      - name: Dashboard quality checks
        working-directory: visp-memory-dashboard
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --omit=dev

      - name: Python package, MCP, and CLI smoke checks
        run: python scripts/release_check.py --skip-frontend

  build-python:
    name: Build Python Package
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Copy Frontend
        run: python build_frontend.py

      - name: Build Python Package
        run: |
          python -m pip install build
          python -m build

      - name: Validate distribution metadata
        # Fails the release early if the long description would not render on
        # PyPI or the metadata is malformed — before any publish is attempted.
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Verify the wheel actually contains the dashboard
        # This is the wheel that ships, and the only place the check is meaningful:
        # it runs after build_frontend.py, unlike the quality gate which builds a
        # throwaway wheel with --skip-frontend. Without this, a release could publish
        # a dashboard-less wheel and nothing would notice.
        run: |
          python - <<'PY'
          import sys, zipfile
          from pathlib import Path

          wheel = next(iter(sorted(Path("dist").glob("*.whl"))), None)
          if wheel is None:
              sys.exit("No wheel found in dist/")

          names = zipfile.ZipFile(wheel).namelist()
          index = "visp_memory/server/static/index.html"
          if index not in names:
              sys.exit(
                  f"{wheel.name} is missing {index}. "
                  "build_frontend.py must run before the package build."
              )
          assets = sum(1 for n in names if n.startswith("visp_memory/server/static/"))
          print(f"{wheel.name}: dashboard present ({assets} static files)")
          PY

      - name: Upload Python Package
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  build-docker:
    name: Build Docker Image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-standalone:
    name: Build Standalone Executable
    needs: quality
    strategy:
      # One OS failing must not cancel the other builds (a cancelled matrix
      # skips the Create Release job and loses ALL artifacts for the tag).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Install UPX (macOS)
        if: runner.os == 'macOS'
        run: brew install upx

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx

      - name: Build and Copy Frontend
        run: python build_frontend.py

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      # This job used to install PyInstaller and nothing else. The project's own
      # dependencies were installed in the `quality` job, on a different runner,
      # so PyInstaller analysed an environment where typer, fastapi and uvicorn
      # did not exist. Unresolvable hidden imports are only a warning, so the
      # build passed and shipped a binary that died on the user's machine.
      # `local-embeddings` and `arcadedb` stay out on purpose: PyTorch exceeds the
      # 2 GB release asset limit, and ArcadeDB needs a JVM the bundle cannot carry.
      - name: Install Project and Bundled Dependencies
        run: python -m pip install -e ".[api,mcp,capture,analysis,chroma,neo4j]"

      # Third-party distributions only. visp_memory.server.app initialises storage
      # at module scope, so importing it here would make the build depend on the
      # runner's data directory rather than on the packaging being correct.
      - name: Verify Bundled Dependencies Are Importable
        run: python -c "import fastapi, uvicorn, typer, mcp, chromadb, neo4j, git, sklearn, visp_memory"

      - name: Build Executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build_standalone.sh

      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller visp-memory.spec
          # build_standalone.sh does this packaging on Linux/macOS, but Windows runs
          # PyInstaller directly and it emits a bare dist/visp-memory.exe. That name
          # does not match the upload glob below, so the upload found nothing, warned
          # instead of failing, and the job still reported success -- every release so
          # far shipped without a Windows binary.
          mkdir -p dist/visp-memory-standalone
          cp dist/visp-memory.exe dist/visp-memory-standalone/
          cp README.md LICENSE NOTICE dist/visp-memory-standalone/
          # Same smoke test build_standalone.sh runs on the other platforms.
          ./dist/visp-memory-standalone/visp-memory.exe --version
          (cd dist && 7z a "visp-memory-standalone-Windows-x86_64.zip" visp-memory-standalone/)
          ls -la dist/visp-memory-standalone-*

      - name: Upload Standalone Build
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}
          path: dist/visp-memory-standalone-*
          # Fail loudly instead of warning. A silent "no files found" is how the Windows
          # binary went missing from every release without anyone noticing.
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [quality, build-python]
    # Only real version tags publish to PyPI (PyPI rejects re-uploads of an
    # existing version, so this must never run on branch pushes or dispatch).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/visp-memory
    permissions:
      # OIDC token for PyPI Trusted Publishing — no API token stored in GitHub.
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # PyPI versions are immutable, so a re-run of an already-published tag would
          # otherwise fail here and block the jobs after it. This makes the release
          # re-runnable: if a later step fails, the tag can be rebuilt without either
          # burning a version number or leaving the GitHub Release unpublished.
          skip-existing: true

  release:
    name: Create Release
    needs: [quality, build-python, build-docker, build-standalone]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # Required for softprops/action-gh-release to create the GitHub Release
      # and upload assets. Without this the default GITHUB_TOKEN is read-only
      # (repo policy) and the release step 403s.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          # Restricted to the artifacts this job actually publishes. An unfiltered
          # download also pulls the `*.dockerbuild` build record that
          # docker/build-push-action uploads, which fails to extract and took the whole
          # release job down after PyPI had already published.
          pattern: "{python-package,standalone-*}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            python-package/*
            standalone-Linux/*
            standalone-macOS/*
            standalone-Windows/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
